name: Publish dashboard

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate static dashboard data
        env:
          PCCADDIE_CLUB_ID: ${{ secrets.PCCADDIE_CLUB_ID }}
          PCCADDIE_USERNAME: ${{ secrets.PCCADDIE_USERNAME }}
          PCCADDIE_PASSWORD: ${{ secrets.PCCADDIE_PASSWORD }}
        run: python scripts/export_static_dashboard.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
